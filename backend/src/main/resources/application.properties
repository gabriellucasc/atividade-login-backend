spring.application.name=atividade-login-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.max-http-request-header-size=16KB
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.login-rate-limit.attempts=${LOGIN_RATE_LIMIT:10}
app.login-rate-limit.window-seconds=60
app.demo.enabled=${DEMO_USER_ENABLED:false}
app.demo.email=${DEMO_USER_EMAIL:}
app.demo.password=${DEMO_USER_PASSWORD:}
