<main>
  <form class="login" (ngSubmit)="onEntrar()">
    <h1>Login</h1>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" [(ngModel)]="email">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" [(ngModel)]="senha">

    <div class="opcoes">
      <button type="button" class="opcao">Esqueci a senha</button>
      <button type="button" class="opcao">Criar conta</button>
    </div>

    <button type="submit" class="entrar">ENTRAR</button>
  </form>
</main>
